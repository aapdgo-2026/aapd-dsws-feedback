<style>
:root{
  --bg:#f7f6f3; --card:#ffffff; --sunk:#efeee9; --ink:#1c1b22; --ink-2:#4f4d57; --ink-3:#86848d;
  --line:rgba(40,36,70,.09); --accent:#534AB7; --accent-soft:#EEEDFE;
  --s1:#534AB7; --s2:#1D9E75; --s3:#D85A30; --s4:#d9a400;
  --good:#1D9E75; --good-soft:#E1F5EE; --warn:#BA7517; --warn-soft:#FAEEDA; --bad:#A32D2D; --bad-soft:#FCEBEB;
  --tip-bg:#1c1b22; --tip-ink:#fff;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
}

  :root:not([data-theme="light"]){
    --bg:#16151a; --card:#1f1e24; --sunk:#2a2930; --ink:#f1f0f5; --ink-2:#c3c1cc; --ink-3:#8d8b97;
    --line:rgba(255,255,255,.08); --accent:#8f87ea; --accent-soft:#2b2848;
    --s1:#8277e0; --s2:#189a70; --s3:#e35d5a; --s4:#bf9a12;

  }
}

  --bg:#16151a; --card:#1f1e24; --sunk:#2a2930; --ink:#f1f0f5; --ink-2:#c3c1cc; --ink-3:#8d8b97;
  --line:rgba(255,255,255,.08); --accent:#8f87ea; --accent-soft:#2b2848;
  --s1:#8277e0; --s2:#189a70; --s3:#e35d5a; --s4:#bf9a12;
  --good:#3fc295; --good-soft:#173a2f; --warn:#e0a346; --warn-soft:#3b2d15; --bad:#ee7b7b; --bad-soft:#3d1f22;
  --tip-bg:#f1f0f5; --tip-ink:#16151a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding-inline:20px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
header{background:var(--card);border-bottom:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-block:26px 20px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
h1{font-size:24px;font-weight:700;line-height:1.3;margin-top:6px;text-wrap:balance}
.sub{font-size:13px;color:var(--ink-3);margin-top:4px}
.head-stats{display:flex;gap:28px}
.hs b{display:block;font-family:var(--mono);font-size:26px;font-weight:500;line-height:1.1}
.hs span{font-size:11px;color:var(--ink-3)}

/* tabs */
nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:13px 16px;border:0;background:none;font:500 13px var(--sans);color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:focus-visible,.scard:focus-visible,.more:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

main{padding-block:26px 40px}
.sec{margin-top:34px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-size:15px;font-weight:700}
.sec-h p{font-size:12px;color:var(--ink-3)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stack{display:grid;gap:14px;align-content:start}
.ptitle{font-size:13px;font-weight:700;margin-bottom:14px}
.ptitle small{font-weight:400;color:var(--ink-3);margin-left:6px}

/* session cards */
.scards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.scard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;font-family:var(--sans);color:var(--ink);display:grid;gap:10px;border-top:3px solid var(--c)}
.scard:hover{border-color:var(--c)}
.scard-top{display:flex;justify-content:space-between;align-items:baseline}
.scard-date{font-weight:700;font-size:15px}
.scard-n{font-size:11px;color:var(--ink-3)}
.scard-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-2)}
.scard-row b{font-family:var(--mono);font-weight:500;font-size:18px;color:var(--ink)}
.pill{font:500 11px var(--mono);padding:1px 8px;border-radius:20px}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.mc-l{font-size:11px;color:var(--ink-3)}
.mc-v{font-family:var(--mono);font-size:28px;font-weight:500;line-height:1.2;margin-top:4px}
.mc-v small{font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-left:3px}
.mc-s{font-size:11px;color:var(--ink-3);margin-top:4px}

/* bars */
.brow{display:grid;grid-template-columns:118px 1fr 40px;align-items:center;gap:10px;margin-bottom:10px}
.brow:last-child{margin-bottom:0}
.bl{font-size:12px;color:var(--ink-2);text-align:right;line-height:1.3}
.bt{position:relative;height:10px;background:var(--sunk);border-radius:4px}
.bf{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--accent)}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.bv{font-family:var(--mono);font-size:12px;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);margin-top:14px}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}

/* charts */
svg text{font-family:var(--mono);font-size:11px;fill:var(--ink-3)}
svg .lab{font-family:var(--sans);fill:var(--ink-2);font-size:11px}
svg .val{fill:var(--ink);font-size:12px;font-weight:500}
.chart{width:100%;height:auto;display:block}

/* heatmap */
.hm-wrap{overflow-x:auto}
table.hm{width:100%;border-collapse:separate;border-spacing:3px;min-width:520px}
.hm th{font-size:11px;font-weight:500;color:var(--ink-3);padding:4px 6px;text-align:center;white-space:nowrap}
.hm th.rl{text-align:right;color:var(--ink-2);font-size:12px;font-weight:400;width:170px}
.hm td{text-align:center;font-family:var(--mono);font-size:12px;padding:9px 4px;border-radius:5px;cursor:default}

/* nps */
.nps-nums{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:14px}
.nn span{display:block;font-size:10px;color:var(--ink-3)}
.nn b{font-family:var(--mono);font-size:22px;font-weight:500}
.npsbar{display:flex;height:12px;gap:2px}
.npsbar div{height:100%}
.npsbar div:first-child{border-radius:4px 0 0 4px}.npsbar div:last-child{border-radius:0 4px 4px 0}
.nps-lab{display:flex;justify-content:space-between;font-size:10px;margin-top:6px}
.explain{background:var(--sunk);border-radius:8px;padding:10px 12px;margin-top:14px;font-size:11px;color:var(--ink-3);line-height:1.8}
.explain b{color:var(--ink-2);font-weight:500}

/* funnel */
.fn-top{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:14px}
.fn-top b{display:block;font-family:var(--mono);font-size:22px;font-weight:500}
.fn-top span{font-size:11px;color:var(--ink-3)}
.fn-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;border-top:1px solid var(--line);padding-top:14px}
.fn-s{font-size:12px;font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.fn-r{display:grid;grid-template-columns:36px 1fr 26px;gap:6px;align-items:center;font-size:11px;color:var(--ink-3);margin-bottom:5px}
.fn-r .bt{height:8px}
.fn-r .bv{font-size:11px}
.pending{font-size:11px;color:var(--ink-3);background:var(--sunk);border-radius:6px;padding:8px 10px;line-height:1.6}

/* feedback */
.fb-cols{columns:2;column-gap:14px}
.fb{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:12px}
.fb-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.chip{font-size:10px;font-weight:500;padding:1px 8px;border-radius:20px;background:var(--sunk);color:var(--ink-2)}
.chip.s{color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.fb p{font-size:13px;line-height:1.8;color:var(--ink)}
.fb p.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.more{margin-top:6px;border:0;background:none;color:var(--accent);font:500 12px var(--sans);cursor:pointer;padding:0}
.fb-group{margin-top:22px}
.fb-group:first-child{margin-top:0}
.fb-gh{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;font-weight:700}
.fb-gh span{font-weight:400;font-size:12px;color:var(--ink-3)}
.note{font-size:12px;color:var(--ink-3);line-height:1.7}
.notes{display:grid;gap:4px;margin-top:10px}

#tip{position:fixed;pointer-events:none;z-index:20;background:var(--tip-bg);color:var(--tip-ink);font-size:12px;line-height:1.5;padding:6px 9px;border-radius:6px;max-width:260px;opacity:0;transition:opacity .1s}
footer{border-top:1px solid var(--line);background:var(--card);color:var(--ink-3);font-size:12px;text-align:center;padding-block:20px}

@media (max-width:760px){
  .scards,.metrics{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .fn-grid{grid-template-columns:repeat(2,1fr)}
  .fb-cols{columns:1}
}
@media (max-width:420px){
  .wrap{padding-inline:16px}
  .brow{grid-template-columns:92px 1fr 34px}
  .head-stats{gap:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- 計算 ---------- */
const rows = R.map(r=>({s:r[0],full:r[1],goals:r[2],q:r.slice(3,8),nps:r[8],ok:r[9],th:r[10]?r[10].split(' '):[],L:r[11],G:r[12],I:r[13],E:r[14]}));
const mean = a => a.reduce((x,y)=>x+y,0)/a.length;
function stats(rs){
  const n=rs.length;
  const items=ITEMS.map((_,i)=>mean(rs.map(r=>r.q[i])));
  const pro=rs.filter(r=>r.nps>=9).length, det=rs.filter(r=>r.nps<=6).length, pas=n-pro-det;
  const dist=[0,0,0,0,0]; rs.forEach(r=>dist[Math.round(mean(r.q)-1e-9)-1]++);
  const goals={}; Object.keys(GOALS).forEach(k=>goals[k]=rs.filter(r=>r.goals.includes(k)).length);
  const themes={}; Object.keys(THEMES).forEach(k=>themes[k]=rs.filter(r=>r.th.includes(k)).length);
  return {n, items, overall:mean(items), rec:mean(rs.map(r=>r.nps)), pro,pas,det, npsScore:Math.round((pro-det)/n*100),
    full:Math.round(rs.filter(r=>r.full).length/n*100), okN:rs.filter(r=>r.ok).length, dist, goals, themes};
}
const ALL = stats(rows);
const BY = {}; Object.keys(SESS).forEach(k=>BY[k]=stats(rows.filter(r=>r.s===k)));
const cv = v => `var(${v})`;
const sgn = v => (v>0?'+':'')+v;
const npsClass = v => v>=20?'good':(v>=0?'warn':'bad');
const esc = s => s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  return `<div class="metrics">
    <div class="mc"><div class="mc-l">回填問卷</div><div class="mc-v">${d.n}<small>份</small></div><div class="mc-s">完整參與 ${d.full}%</div></div>
    <div class="mc"><div class="mc-l">五項平均滿意度</div><div class="mc-v">${d.overall.toFixed(2)}<small>/ 5</small></div><div class="mc-s">最低項：${ITEMS[d.items.indexOf(Math.min(...d.items))]}</div></div>
    <div class="mc"><div class="mc-l">NPS 淨推薦值</div><div class="mc-v">${sgn(d.npsScore)}</div><div class="mc-s">推薦意願平均 ${d.rec.toFixed(1)} / 10</div></div>
    <div class="mc"><div class="mc-l">同意公開回饋</div><div class="mc-v">${Math.round(d.okN/d.n*100)}<small>%</small></div><div class="mc-s">${d.okN} 位同意</div></div>
  </div>`;
}
function itemBars(d, compare){
  return `<div class="panel"><div class="ptitle">各項評分細項<small>1–5 分</small></div>
    ${ITEMS.map((l,i)=>`<div class="brow" data-tip="${l}：${d.items[i].toFixed(2)}${compare?`（全部場次 ${ALL.items[i].toFixed(2)}）`:''}">
      <div class="bl">${l}</div>
      <div class="bt"><div class="bf" style="width:${d.items[i]/5*100}%"></div>${compare?`<div class="tick" style="left:calc(${ALL.items[i]/5*100}% - 1px)"></div>`:''}</div>
      <div class="bv">${d.items[i].toFixed(2)}</div></div>`).join('')}
    ${compare?`<div class="legend"><span><i style="width:14px;height:8px;background:var(--accent);border-radius:2px"></i>本場次</span><span><i style="width:2px;height:12px;background:var(--ink)"></i>全部場次平均</span></div>`:''}
  </div>`;
}
function distPanel(d){
  const mx=Math.max(...d.dist)||1;
  return `<div class="panel"><div class="ptitle">個人平均分分佈<small>每位學員五項平均，四捨五入</small></div>
    ${d.dist.map((v,i)=>`<div class="brow" style="grid-template-columns:40px 1fr 30px" data-tip="${i+1} 分：${v} 人（${Math.round(v/d.n*100)}%）">
      <div class="bl">${i+1} 分</div><div class="bt"><div class="bf" style="width:${v/mx*100}%;opacity:${.35+i*.16}"></div></div><div class="bv">${v}</div></div>`).join('')}
  </div>`;
}
function npsPanel(d){
  const p=x=>Math.round(x/d.n*100);
  return `<div class="panel"><div class="ptitle">NPS 推薦分析</div>
    <div class="nps-nums">
      <div class="nn"><span>NPS</span><b>${sgn(d.npsScore)}</b></div>
      <div class="nn"><span style="color:var(--good)">推薦者 9–10</span><b>${d.pro}</b></div>
      <div class="nn"><span style="color:var(--warn)">被動者 7–8</span><b>${d.pas}</b></div>
      <div class="nn"><span style="color:var(--bad)">批評者 0–6</span><b>${d.det}</b></div>
    </div>
    <div class="npsbar">
      <div style="width:${p(d.det)}%;background:var(--bad)" data-tip="批評者 ${d.det} 人（${p(d.det)}%）"></div>
      <div style="width:${p(d.pas)}%;background:var(--warn)" data-tip="被動者 ${d.pas} 人（${p(d.pas)}%）"></div>
      <div style="width:${p(d.pro)}%;background:var(--good)" data-tip="推薦者 ${d.pro} 人（${p(d.pro)}%）"></div>
    </div>
    <div class="nps-lab"><span style="color:var(--bad)">批評者 ${p(d.det)}%</span><span style="color:var(--warn)">被動者 ${p(d.pas)}%</span><span style="color:var(--good)">推薦者 ${p(d.pro)}%</span></div>
    <div class="explain"><b>怎麼算？</b>問題是「你有多可能推薦這堂課（0–10 分）」。NPS = 推薦者% − 批評者% = ${p(d.pro)}% − ${p(d.det)}% = <b class="num">${sgn(d.npsScore)}</b>。範圍 −100 到 +100，0 以上為正向，+50 以上屬優秀。</div>
  </div>`;
}
function goalPanel(d){
  const e=Object.entries(d.goals).sort((a,b)=>b[1]-a[1]);
  return `<div class="panel"><div class="ptitle">報名主要目的<small>複選，佔回填 %</small></div>
    ${e.map(([k,v])=>`<div class="brow" style="grid-template-columns:128px 1fr 40px" data-tip="${GOALS[k]}：${v} 人">
      <div class="bl">${GOALS[k]}</div><div class="bt"><div class="bf" style="width:${v/d.n*100}%;opacity:.7"></div></div><div class="bv">${Math.round(v/d.n*100)}%</div></div>`).join('')}
  </div>`;
}
function themePanel(d){
  const e=Object.entries(d.themes).sort((a,b)=>b[1]-a[1]);
  const mx=Math.max(1,...e.map(x=>x[1]));
  return `<div class="panel"><div class="ptitle">改善建議主題<small>提到該主題的人數</small></div>
    ${e.map(([k,v])=>`<div class="brow" style="grid-template-columns:150px 1fr 26px" data-tip="${THEMES[k]}：${v} 人提到（${Math.round(v/d.n*100)}%）">
      <div class="bl">${THEMES[k]}</div><div class="bt"><div class="bf" style="width:${v/mx*100}%;background:var(--warn)"></div></div><div class="bv">${v}</div></div>`).join('')}
    <p class="note" style="margin-top:12px">主題由開放題人工歸類，一則回饋可歸入多個主題；未同意公開者的內容僅計入人數。</p>
  </div>`;
}

/* ---------- 全部場次專屬：比較圖 ---------- */
function sessionCards(){
  return `<div class="scards">${Object.entries(SESS).map(([k,s])=>{const d=BY[k];return `
    <button class="scard" style="--c:${cv(s.v)}" data-go="${k}" aria-label="查看 ${s.label} 場次">
      <div class="scard-top"><span class="scard-date">${s.label}</span><span class="scard-n">${d.n} 份回填</span></div>
      <div class="scard-row"><span>平均滿意度</span><b>${d.overall.toFixed(2)}</b></div>
      <div class="scard-row"><span>NPS</span><span class="pill ${npsClass(d.npsScore)}">${sgn(d.npsScore)}</span></div>
      <div class="scard-row"><span>推薦者／批評者</span><span class="num">${d.pro} / ${d.det}</span></div>
    </button>`}).join('')}</div>`;
}
function trendChart(){
  const W=420,H=210,L=40,Rt=16,T=24,B=34, keys=Object.keys(SESS);
  const x=i=>L+ (W-L-Rt)*(i+.5)/keys.length, y=v=>T+(H-T-B)*(1-(v-3.5)/1.5);
  const ticks=[3.5,4,4.5,5];
  const pts=keys.map((k,i)=>[x(i),y(BY[k].overall)]);
  return `<div class="panel"><div class="ptitle">平均滿意度走勢<small>五項平均，縱軸自 3.5 起</small></div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="各場次平均滿意度">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-Rt}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${t.toFixed(1)}</text>`).join('')}
    <polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="1 0"/>
    ${keys.map((k,i)=>`<g data-tip="${SESS[k].label}：平均 ${BY[k].overall.toFixed(2)}（${BY[k].n} 份）">
      <rect x="${x(i)-30}" y="${T}" width="60" height="${H-T-B}" fill="transparent"/>
      <circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="6" fill="${cv(SESS[k].v)}" stroke="var(--card)" stroke-width="2"/>
      <text class="val" x="${pts[i][0]}" y="${pts[i][1]-12}" text-anchor="middle">${BY[k].overall.toFixed(2)}</text>
      <text class="lab" x="${x(i)}" y="${H-12}" text-anchor="middle">${SESS[k].label}</text></g>`).join('')}
  </svg></div>`;
}
function npsChart(){
  const W=420,H=210,L=40,Rt=16,T=24,B=34, keys=Object.keys(SESS);
  const lo=-20,hi=40, y=v=>T+(H-T-B)*(hi-v)/(hi-lo), bw=38;
  const x=i=>L+(W-L-Rt)*(i+.5)/keys.length;
  const ticks=[-20,0,20,40];
  return `<div class="panel"><div class="ptitle">NPS 走勢<small>推薦者% − 批評者%</small></div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="各場次 NPS">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-Rt}" y1="${y(t)}" y2="${y(t)}" stroke="${t===0?'var(--ink-3)':'var(--line)'}" stroke-width="1"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${sgn(t)}</text>`).join('')}
    ${keys.map((k,i)=>{const v=BY[k].npsScore, top=Math.min(y(v),y(0)), h=Math.max(2,Math.abs(y(v)-y(0)));
      return `<g data-tip="${SESS[k].label}：NPS ${sgn(v)}（推薦 ${BY[k].pro}・被動 ${BY[k].pas}・批評 ${BY[k].det}）">
      <rect x="${x(i)-30}" y="${T}" width="60" height="${H-T-B}" fill="transparent"/>
      <rect x="${x(i)-bw/2}" y="${top}" width="${bw}" height="${h}" rx="4" fill="${cv(SESS[k].v)}"/>
      <text class="val" x="${x(i)}" y="${v>=0?top-7:top+h+15}" text-anchor="middle">${sgn(v)}</text>
      <text class="lab" x="${x(i)}" y="${H-12}" text-anchor="middle">${SESS[k].label}</text></g>`}).join('')}
  </svg></div>`;
}
function heat(title, note, rowsDef, cellFn){
  const keys=Object.keys(SESS);
  return `<div class="panel"><div class="ptitle">${title}<small>${note}</small></div><div class="hm-wrap"><table class="hm">
    <thead><tr><th></th>${keys.map(k=>`<th><span class="dot" style="display:inline-block;background:${cv(SESS[k].v)};margin-right:5px"></span>${SESS[k].label}</th>`).join('')}<th>全部</th></tr></thead>
    <tbody>${rowsDef.map(rd=>`<tr><th class="rl">${rd.label}</th>${[...keys,'all'].map(k=>cellFn(rd,k)).join('')}</tr>`).join('')}</tbody></table></div></div>`;
}
function cell(t, text, tip){ // t: 0..1 intensity
  const pct=Math.round(8+t*80);
  return `<td style="background:color-mix(in oklab, var(--accent) ${pct}%, var(--card));color:${pct>52?'#fff':'var(--ink)'}" data-tip="${tip}">${text}</td>`;
}
function scoreHeat(){
  return heat('五項評分 × 場次','平均分，顏色越深越高（3.5–5.0）', ITEMS.map((l,i)=>({label:l,i})), (rd,k)=>{
    const v=(k==='all'?ALL:BY[k]).items[rd.i]; return cell(Math.max(0,Math.min(1,(v-3.5)/1.5)), v.toFixed(2), `${k==='all'?'全部場次':SESS[k].label}・${rd.label}：${v.toFixed(2)}`);
  });
}
function themeHeat(){
  const order=Object.keys(THEMES).sort((a,b)=>ALL.themes[b]-ALL.themes[a]);
  return heat('改善建議主題 × 場次','提到該主題的學員佔該場回填 %', order.map(k=>({label:THEMES[k],k})), (rd,k)=>{
    const d=k==='all'?ALL:BY[k], c=d.themes[rd.k], p=Math.round(c/d.n*100);
    return cell(Math.min(1,p/35), c?p+'%':'–', `${k==='all'?'全部場次':SESS[k].label}・${rd.label}：${c} 人（${p}%）`);
  });
}

/* ---------- 文字回饋 ---------- */
const SKIP=/^(無|No|沒有)$/;
function fbCards(list, key){
  if(!list.length) return `<p class="note">這一類沒有可公開的文字回饋。</p>`;
  return `<div class="fb-cols">${list.map((r,idx)=>{const t=r[key], long=t.length>150;return `
    <div class="fb"><div class="fb-meta"><span class="chip s"><span class="dot" style="background:${cv(SESS[r.s].v)}"></span>${SESS[r.s].label}</span><span class="chip num">推薦 ${r.nps}</span><span class="chip num">滿意 ${mean(r.q).toFixed(1)}</span></div>
    <p class="${long?'clamp':''}" id="fb-${key}-${idx}">${esc(t)}</p>${long?`<button class="more" data-more="fb-${key}-${idx}">展開全文</button>`:''}</div>`}).join('')}</div>`;
}
let FB_ROWS=[];
function feedback(rs, limit){
  FB_ROWS=rs;
  const pub=rs.filter(r=>r.ok);
  const g=(k)=>pub.filter(r=>r[k]&&!SKIP.test(r[k].trim()));
  const groups=[
    ['L','推薦者：最喜歡的部分','給 9–10 分的學員', 'var(--good)'],
    ['G','被動者：還差什麼才會推薦','給 7–8 分的學員', 'var(--warn)'],
    ['I','批評者：希望加強的地方','給 0–6 分的學員', 'var(--bad)'],
    ['E','給講師與團隊的話','所有人', 'var(--accent)']
  ];
  const cap=limit?4:Infinity;
  return groups.map(([k,t,s,c])=>{const list=g(k); const shown=list.slice(0,cap); return `<div class="fb-group" id="grp-${k}"><div class="fb-gh"><span class="dot" style="background:${c};width:10px;height:10px"></span>${t}<span>${s} · ${list.length} 則</span></div>${fbCards(shown,k)}${list.length>cap?`<button class="more" data-expand="${k}">看全部 ${list.length} 則</button>`:''}</div>`}).join('');
}

/* ---------- 漏斗 ---------- */
function funnelRow(lbl,v,max,color,op){return `<div class="fn-r"><span>${lbl}</span><div class="bt"><div class="bf" style="width:${v/max*100}%;background:${color};opacity:${op}"></div></div><span class="bv">${v}</span></div>`}
function funnel(key){
  if(key==='all'){
    const known=Object.keys(SESS).filter(k=>SESS[k].reg), withAtt=Object.keys(SESS).filter(k=>SESS[k].att);
    const reg=known.reduce((a,k)=>a+SESS[k].reg,0), attK=known.reduce((a,k)=>a+SESS[k].att,0);
    const att=withAtt.reduce((a,k)=>a+SESS[k].att,0), resp=withAtt.reduce((a,k)=>a+BY[k].n,0);
    const allReg=known.length===Object.keys(SESS).length;
    return `<div class="panel">
      <div class="fn-top"><div><b>${reg}</b><span>報名${allReg?'':'（前三場）'}</span></div><div><b>${att}</b><span>出席｜${allReg?'':'前三場出席率 '}${Math.round(attK/reg*100)}%</span></div><div><b>${resp}</b><span>回填｜出席者的 ${Math.round(resp/att*100)}%</span></div></div>
      <div class="fn-grid">${Object.entries(SESS).map(([k,s])=>`<div><div class="fn-s"><span class="dot" style="background:${cv(s.v)}"></span>${s.label}</div>
        ${s.reg?funnelRow('報名',s.reg,s.reg,cv(s.v),.25)+funnelRow('出席',s.att,s.reg,cv(s.v),.55)+funnelRow('回填',BY[k].n,s.reg,cv(s.v),1)
        :s.att?`<div class="fn-r"><span>報名</span><span class="note" style="font-size:11px">待補</span><span></span></div>`+funnelRow('出席',s.att,Math.max(...known.map(j=>SESS[j].reg)),cv(s.v),.55)+funnelRow('回填',BY[k].n,Math.max(...known.map(j=>SESS[j].reg)),cv(s.v),1)
        :`<div class="pending">報名與出席人數待補，目前回填 <b class="num">${BY[k].n}</b> 份</div>`}</div>`).join('')}</div></div>`;
  }
  const s=SESS[key], d=BY[key];
  if(!s.reg && s.att) return `<div class="panel"><div class="fn-top"><div><b style="color:var(--ink-3)">—</b><span>報名｜待補</span></div><div><b>${s.att}</b><span>出席</span></div><div><b>${d.n}</b><span>回填｜出席者的 ${Math.round(d.n/s.att*100)}%</span></div></div>
    ${funnelRow('出席',s.att,s.att,cv(s.v),.55)}${funnelRow('回填',d.n,s.att,cv(s.v),1)}</div>`;
  if(!s.reg) return `<div class="panel"><div class="pending">本場報名與出席人數尚未提供，目前回填 <b class="num">${d.n}</b> 份。補上後即可看到填寫率。</div></div>`;
  return `<div class="panel"><div class="fn-top"><div><b>${s.reg}</b><span>報名</span></div><div><b>${s.att}</b><span>出席｜${Math.round(s.att/s.reg*100)}%</span></div><div><b>${d.n}</b><span>回填｜出席者的 ${Math.round(d.n/s.att*100)}%</span></div></div>
    ${funnelRow('報名',s.reg,s.reg,cv(s.v),.25)}${funnelRow('出席',s.att,s.reg,cv(s.v),.55)}${funnelRow('回填',d.n,s.reg,cv(s.v),1)}</div>`;
}

/* ---------- 版面 ---------- */
function sec(title,note,body){return `<section class="sec"><div class="sec-h"><h2>${title}</h2>${note?`<p>${note}</p>`:''}</div>${body}</section>`}
function render(key){
  const m=document.getElementById('main');
  if(key==='all'){
    m.innerHTML =
      sec('四個場次一覽','點選卡片可看該場次細節', sessionCards()) +
      sec('場次趨勢','', `<div class="grid2">${trendChart()}${npsChart()}</div>`) +
      sec('評分與問題的場次差異','', `<div class="stack">${scoreHeat()}${themeHeat()}</div>`) +
      sec('參與與填寫概況','', funnel('all')) +
      sec('全部場次整體指標', `${ALL.n} 份回填`, metrics(ALL)) +
      sec('評分與推薦','', `<div class="grid2">${itemBars(ALL,false)}<div class="stack">${distPanel(ALL)}${npsPanel(ALL)}</div></div>`) +
      sec('報名動機與改善方向','', `<div class="grid2">${goalPanel(ALL)}${themePanel(ALL)}</div>`) +
      sec('學員文字回饋','每類先列 4 則，完整內容可展開或切到各場次查看', `<div id="fbAll">${feedback(rows,true)}</div>`) +
      sec('資料說明','', `<div class="panel notes">
        <p class="note">・原始 91 筆回覆中，排除 1 筆開課前的內部測試（3/12），並合併 2 位重複送出的學員（各保留最後一次），共 88 份。</p>
        <p class="note">・前三場的報名／出席人數沿用先前整理的數字；8/22 場次出席 28 人，報名人數尚待補上。</p>
        <p class="note">・問卷的開放題依推薦分數分流：9–10 分回答「最喜歡的部分」、7–8 分回答「還差什麼才會推薦」、0–6 分回答「哪裡需要加強」。</p></div>`);
  } else {
    const d=BY[key], rs=rows.filter(r=>r.s===key), s=SESS[key];
    const diff=d.overall-ALL.overall;
    m.innerHTML =
      sec(`${s.long} 場次`, `${d.n} 份回填 · 平均滿意度較全部場次 ${diff>=0?'高':'低'} ${Math.abs(diff).toFixed(2)} 分`, funnel(key)) +
      sec('整體指標','', metrics(d)) +
      sec('評分與推薦','', `<div class="grid2">${itemBars(d,true)}<div class="stack">${distPanel(d)}${npsPanel(d)}</div></div>`) +
      sec('報名動機與改善方向','', `<div class="grid2">${goalPanel(d)}${themePanel(d)}</div>`) +
      sec('學員文字回饋','只收錄同意公開者', feedback(rs));
  }
}

/* ---------- 分頁 ---------- */
const tabs=document.getElementById('tabs');
const TABDEF=[['all','全部場次',null],...Object.entries(SESS).map(([k,s])=>[k,s.label,s.v])];
tabs.innerHTML=TABDEF.map(([k,l,v],i)=>`<button class="tab" role="tab" id="tab-${k}" data-tab="${k}" aria-selected="${i===0}">${v?`<span class="dot" style="background:${cv(v)}"></span>`:''}${l}${k!=='all'?` <span class="num" style="color:var(--ink-3);font-size:11px">${BY[k].n}</span>`:''}</button>`).join('');
function go(k){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===k));
  render(k); try{localStorage.setItem('dsws-tab',k)}catch(e){}
}
tabs.addEventListener('click',e=>{const b=e.target.closest('[data-tab]'); if(b){go(b.dataset.tab); window.scrollTo({top:0})}});
document.getElementById('main').addEventListener('click',e=>{
  const c=e.target.closest('[data-go]'); if(c){go(c.dataset.go); window.scrollTo({top:0}); return;}
  const ex=e.target.closest('[data-expand]');
  if(ex){const k=ex.dataset.expand, grp=document.getElementById('grp-'+k);
    const tmp=document.createElement('div'); tmp.innerHTML=feedback(FB_ROWS,false);
    grp.replaceWith(tmp.querySelector('#grp-'+k)); return;}
  const mo=e.target.closest('[data-more]'); if(mo){const p=document.getElementById(mo.dataset.more); const open=p.classList.toggle('clamp'); mo.textContent=open?'展開全文':'收合';}
});
document.getElementById('headStats').innerHTML=`
  <div class="hs"><b>${ALL.n}</b><span>份問卷回覆</span></div>
  <div class="hs"><b>${ALL.overall.toFixed(2)}</b><span>平均滿意度 / 5</span></div>
  <div class="hs"><b>${sgn(ALL.npsScore)}</b><span>整體 NPS</span></div>`;

/* ---------- tooltip ---------- */
const tip=document.getElementById('tip');
document.addEventListener('mousemove',e=>{
  const t=e.target.closest('[data-tip]');
  if(!t){tip.style.opacity=0;return;}
  tip.textContent=t.dataset.tip; tip.style.opacity=1;
  const w=tip.offsetWidth, x=Math.min(e.clientX+14, innerWidth-w-8);
  tip.style.left=x+'px'; tip.style.top=(e.clientY+16)+'px';
});

let start='all'; try{const s=localStorage.getItem('dsws-tab'); if(s&&(s==='all'||SESS[s]))start=s}catch(e){}
go(start);
</script>

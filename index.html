    --coral: #D85A30;
    --coral-light: #FAECE7;
    --amber: #BA7517;
    --amber-light: #FAEEDA;
    --red: #A32D2D;
    --red-light: #FCEBEB;
    --text: #1a1a1a;
    --text-2: #555;
    --text-3: #888;
    --border: rgba(0,0,0,0.08);
    --bg: #f7f6f3;
    --card: #ffffff;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; }

  /* HEADER */
  .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 24px; }
  .header-inner { max-width: 900px; margin: 0 auto; padding: 20px 0 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .header-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--purple-light); color: var(--purple); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; letter-spacing: 0.04em; margin-bottom: 8px; }
  .header-title { font-size: 20px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .header-sub { font-size: 13px; color: var(--text-3); margin-top: 4px; }
  .header-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .header-stat { text-align: right; }
  .header-stat-num { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; color: var(--purple); }
  .header-stat-label { font-size: 11px; color: var(--text-3); }

  /* TABS */
  .tab-wrap { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 24px; position: sticky; top: 0; z-index: 10; }
  .tab-inner { max-width: 900px; margin: 0 auto; display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; }
  .tab-inner::-webkit-scrollbar { display: none; }
  .tab-btn { padding: 14px 18px; font-size: 13px; font-weight: 500; color: var(--text-3); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; font-family: 'Noto Sans TC', sans-serif; transition: all 0.15s; }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--purple); border-bottom-color: var(--purple); }

  /* MAIN */
  .main { max-width: 900px; margin: 0 auto; padding: 24px; }

  /* SECTION */
  .section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); margin: 28px 0 12px; }
  .section-label:first-child { margin-top: 0; }

  /* METRIC CARDS */
  .metrics-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .mc { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; }
  .mc-label { font-size: 11px; color: var(--text-3); margin-bottom: 6px; }
  .mc-val { font-family: 'DM Mono', monospace; font-size: 28px; font-weight: 500; color: var(--text); line-height: 1; }
  .mc-val span { font-size: 13px; color: var(--text-3); font-family: 'Noto Sans TC', sans-serif; }
  .mc-sub { font-size: 11px; color: var(--text-3); margin-top: 5px; }

  /* FUNNEL */
  .funnel-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
  .funnel-sessions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .funnel-session-label { font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 10px; }
  .funnel-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .funnel-bar-label { font-size: 11px; color: var(--text-3); width: 42px; flex-shrink: 0; }
  .funnel-bar-track { flex: 1; background: #f0efe9; border-radius: 4px; height: 8px; overflow: hidden; }
  .funnel-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
  .funnel-bar-val { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-3); width: 30px; text-align: right; }
  .funnel-divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .funnel-all-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .funnel-all-item { display: flex; flex-direction: column; gap: 3px; }
  .funnel-all-num { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 500; }
  .funnel-all-sub { font-size: 11px; color: var(--text-3); }

  /* TWO COL */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* CHART CARD */
  .cc { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }

  .score-label { font-size: 12px; color: var(--text-2); width: 100px; flex-shrink: 0; text-align: right; line-height: 1.3; }
  .score-track { flex: 1; background: #f0efe9; border-radius: 4px; height: 9px; overflow: hidden; }
  .score-fill { height: 100%; border-radius: 4px; background: var(--purple); transition: width 0.5s; }
  .score-val { font-size: 12px; font-weight: 500; font-family: 'DM Mono', monospace; color: var(--text); width: 26px; }
  .dist-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .dist-label { font-size: 12px; color: var(--text-3); width: 26px; }
  .dist-track { flex: 1; background: #f0efe9; border-radius: 4px; height: 8px; overflow: hidden; }
  .dist-fill { height: 100%; border-radius: 4px; background: #EF9F27; transition: width 0.5s; }
  .dist-count { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--text-3); width: 18px; text-align: right; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  /* NPS */
  .nps-nums { display: flex; gap: 20px; margin-bottom: 14px; }
  .nps-item { display: flex; flex-direction: column; gap: 2px; }
  .nps-item-label { font-size: 10px; color: var(--text-3); }
  .nps-item-val { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; }
  .nps-bar-wrap { display: flex; height: 10px; border-radius: 6px; overflow: hidden; gap: 1px; }
  .nps-seg { height: 100%; transition: width 0.5s; }
  .nps-seg-labels { display: flex; justify-content: space-between; margin-top: 6px; }
  .nps-seg-label { font-size: 10px; color: var(--text-3); }
  .nps-explain { background: #f7f6f3; border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 14px; font-size: 11px; color: var(--text-3); line-height: 1.7; }
  .nps-explain strong { color: var(--text-2); font-weight: 500; }
  .nps-chips { display: flex; gap: 5px; flex-wrap: wrap; margin: 4px 0; }
  .chip { font-size: 10px; padding: 1px 7px; border-radius: 20px; font-weight: 500; }
  .chip-g { background: var(--green-light); color: var(--green); }
  .chip-a { background: var(--amber-light); color: var(--amber); }
  .chip-r { background: var(--red-light); color: var(--red); }
  .nps-formula { font-family: 'DM Mono', monospace; font-size: 11px; margin-top: 4px; color: var(--text-2); }

  /* PURPOSE */
  .purpose-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .purpose-label { font-size: 12px; color: var(--text-2); flex: 0 0 auto; max-width: 155px; line-height: 1.3; }
  .purpose-track { flex: 1; background: #f0efe9; border-radius: 4px; height: 8px; overflow: hidden; }
  .purpose-fill { height: 100%; border-radius: 4px; background: var(--purple); opacity: 0.6; transition: width 0.5s; }
  .purpose-cnt { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-3); width: 22px; text-align: right; }

  /* TAGS */
  .tag { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 20px; margin: 0 4px 5px 0; line-height: 1.5; }
  .tag-g { background: var(--green-light); color: #0a5e40; }
  .tag-a { background: var(--amber-light); color: #7a4a00; }

  /* COMMENTS */
  .comment-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .comment-badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 20px; background: var(--purple-light); color: var(--purple); font-weight: 500; margin-bottom: 8px; }
  .comment-text { font-size: 13px; color: var(--text); line-height: 1.75; }
  .improve-card { background: var(--card); border: 1px solid var(--border); border-left: 3px solid #EF9F27; border-radius: 0 var(--radius) var(--radius) 0; padding: 12px 16px; margin-bottom: 10px; }
  .improve-text { font-size: 13px; color: var(--text-2); line-height: 1.75; }

  /* FOOTER */
  .footer { background: var(--card); border-top: 1px solid var(--border); padding: 20px 24px; text-align: center; color: var(--text-3); font-size: 12px; margin-top: 40px; }
  .footer a { color: var(--purple); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  @media (max-width: 600px) {
    .main { padding: 16px; }
    .two-col { grid-template-columns: 1fr; }
    .funnel-sessions { grid-template-columns: 1fr; }
    .funnel-all-row { grid-template-columns: repeat(3,1fr); }
    .header-inner { flex-direction: column; }
    .header-meta { align-items: flex-start; }
  }
</style>

function nps(arr) { const t=arr[0]+arr[1]+arr[2]; return Math.round((arr[2]-arr[0])/t*100); }
function pct(a,b) { return Math.round(a/b*100); }

      <div class="funnel-bar-row">
        <div class="funnel-bar-label">報名</div>
        <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width:100%;background:${m.color};opacity:0.2;"></div></div>
        <div class="funnel-bar-val">${m.registered}</div>
      </div>
      <div class="funnel-bar-row">
        <div class="funnel-bar-label">出席</div>
        <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width:${pct(m.attended,m.registered)}%;background:${m.color};opacity:0.5;"></div></div>
        <div class="funnel-bar-val">${m.attended}</div>
      </div>
      <div class="funnel-bar-row">
        <div class="funnel-bar-label">填問卷</div>
        <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width:${pct(m.responses,m.registered)}%;background:${m.color};"></div></div>
        <div class="funnel-bar-val">${m.responses}</div>
      </div>
    </div>`;
}

function npsBlock(d) {
  const total = d.nps[0]+d.nps[1]+d.nps[2];
  const npsVal = nps(d.nps);
  const proP = pct(d.nps[2],total), pasP = pct(d.nps[1],total), detP = pct(d.nps[0],total);
  return `
    <div class="cc-title">NPS 推薦分析</div>
    <div class="nps-nums">
      <div class="nps-item"><div class="nps-item-label">NPS 分數</div><div class="nps-item-val" style="color:var(--purple);">${npsVal>=0?'+':''}${npsVal}</div></div>
      <div class="nps-item"><div class="nps-item-label" style="color:var(--green);">推薦者 9–10</div><div class="nps-item-val" style="color:var(--green);">${d.nps[2]}</div></div>
      <div class="nps-item"><div class="nps-item-label" style="color:var(--amber);">被動者 7–8</div><div class="nps-item-val" style="color:var(--amber);">${d.nps[1]}</div></div>
      <div class="nps-item"><div class="nps-item-label" style="color:var(--red);">批評者 ≤6</div><div class="nps-item-val" style="color:var(--red);">${d.nps[0]}</div></div>
    </div>
    <div class="nps-bar-wrap">
      <div class="nps-seg" style="width:${detP}%;background:var(--red-light);"></div>
      <div class="nps-seg" style="width:${pasP}%;background:var(--amber-light);"></div>
      <div class="nps-seg" style="width:${proP}%;background:var(--green-light);"></div>
    </div>
    <div class="nps-seg-labels">
      <span class="nps-seg-label" style="color:var(--red);">批評者 ${detP}%</span>
      <span class="nps-seg-label" style="color:var(--amber);">被動者 ${pasP}%</span>
      <span class="nps-seg-label" style="color:var(--green);">推薦者 ${proP}%</span>
    </div>
    <div class="nps-explain">
      <strong>什麼是 NPS？</strong>「你有多可能推薦這堂課？（0–10 分）」<br>
      <div class="nps-chips">
        <span class="chip chip-g">9–10 推薦者</span>
        <span class="chip chip-a">7–8 被動者</span>
        <span class="chip chip-r">0–6 批評者</span>
      </div>
      <div class="nps-formula">NPS = 推薦者% − 批評者% = ${proP}% − ${detP}% = ${npsVal>=0?'+':''}${npsVal}</div>
      分數範圍 −100 至 +100，0 以上為正向，+50 以上優秀。
    </div>`;
}

function render(key) {
  const d = DATA[key];
  const distMax = Math.max(...d.dist);
  const distLabels = ['1★','2★','3★','4★','5★'];
  const purpMax = Math.max(...Object.values(d.purpose));

  document.getElementById('main').innerHTML = `
    ${funnelBlock(key)}

    <div class="section-label">整體指標</div>
    <div class="metrics-row">
      <div class="mc"><div class="mc-label">回填人數</div><div class="mc-val">${d.responses}<span> 份</span></div><div class="mc-sub">完整參與 ${d.full_attend}%</div></div>
      <div class="mc"><div class="mc-label">課程平均評分</div><div class="mc-val">${d.overall.toFixed(2)}<span> / 5</span></div><div class="mc-sub" style="color:#EF9F27;">${'★'.repeat(Math.round(d.overall))}${'☆'.repeat(5-Math.round(d.overall))}</div></div>
      <div class="mc"><div class="mc-label">推薦意願</div><div class="mc-val">${d.recommend_avg.toFixed(1)}<span> / 10</span></div><div class="mc-sub">NPS ${nps(d.nps)>=0?'+':''}${nps(d.nps)}</div></div>
      <div class="mc"><div class="mc-label">同意公開回饋</div><div class="mc-val">${d.consent}<span>%</span></div><div class="mc-sub">${Math.round(d.responses*d.consent/100)} 位同意</div></div>
    </div>

    <div class="two-col">
      <div class="cc">
        <div class="cc-title">各項評分細項</div>
        ${Object.entries(d.scores).map(([l,v])=>`
          <div class="score-row">
            <div class="score-label">${l}</div>
            <div class="score-track"><div class="score-fill" style="width:${v/5*100}%;"></div></div>
            <div class="score-val">${v.toFixed(1)}</div>
          </div>`).join('')}
      </div>
      <div>
        <div class="cc" style="margin-bottom:14px;">
          <div class="cc-title">整體評分分佈</div>
          ${d.dist.map((v,i)=>`
            <div class="dist-row">
              <div class="dist-label">${distLabels[i]}</div>
              <div class="dist-track"><div class="dist-fill" style="width:${distMax?(v/distMax*100):0}%;"></div></div>
              <div class="dist-count">${v}</div>
            </div>`).join('')}
        </div>
        <div class="cc">${npsBlock(d)}</div>
      </div>
    </div>

    <div class="two-col" style="margin-top:14px;">
      <div class="cc">
        <div class="cc-title">報名主要目的</div>
        ${Object.entries(d.purpose).map(([l,c])=>`
          <div class="purpose-row">
            <div class="purpose-label">${l}</div>
            <div class="purpose-track"><div class="purpose-fill" style="width:${c/purpMax*100}%;"></div></div>
            <div class="purpose-cnt">${c}</div>
          </div>`).join('')}
      </div>
      <div class="cc">
        <div class="cc-title">課程亮點</div>
        <div style="margin-bottom:14px;">${d.likes.map(l=>`<span class="tag tag-g">${l.length>28?l.slice(0,26)+'…':l}</span>`).join('')}</div>
        <div class="cc-title">改善建議</div>
        ${d.improve.map(i=>`<span class="tag tag-a">${i.length>28?i.slice(0,26)+'…':i}</span>`).join('')}
      </div>
    </div>

    <div class="section-label">學員完整回饋</div>
    <div class="two-col">
      <div>
        <div style="font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:10px;">最喜歡的部分</div>
        ${d.likes.map(l=>`<div class="comment-card"><span class="comment-badge">${d.label}</span><p class="comment-text">${l}</p></div>`).join('')}
        ${d.extra.length?`
          <div style="font-size:12px;font-weight:500;color:var(--text-2);margin:14px 0 10px;">給講師的話</div>
          ${d.extra.map(e=>`<div class="comment-card"><p class="comment-text">${e}</p></div>`).join('')}`:''}
      </div>
      <div>
        <div style="font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:10px;">改善建議</div>
        ${d.improve.map(i=>`<div class="improve-card"><p class="improve-text">${i}</p></div>`).join('')}
      </div>
    </div>
  `;
}

function switchTab(btn, key) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render(key);
}

render('all');
</script>
</body>
</html>
